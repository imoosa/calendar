name: interfaith_calendar_app
description: Multi-faith calendar app with prayer times, Qibla, and Vastu, backed by the existing Flask API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.1

  # Native home-screen widget bridge (Android Glance / iOS WidgetKit)
  home_widget: ^0.7.0

  # Compass for Qibla direction
  flutter_compass: ^0.8.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Date handling across calendar systems
  intl: ^0.19.0

  # Simple local caching so widget/app have last-known data offline
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
